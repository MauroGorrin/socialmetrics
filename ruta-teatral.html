    @keyframes revealUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes revealLeft {
      from { opacity: 0; transform: translateX(-40px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes posterIn {
      from { opacity: 0; transform: perspective(900px) rotateY(-20deg) translateX(60px) scale(0.9); }
      to   { opacity: 1; transform: perspective(900px) rotateY(-8deg) translateX(0) scale(1); }
    }
    @keyframes tagIn {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounceIn {
      0%  { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.08); }
      100%{ transform: scale(1); opacity: 1; }

    /* ── HERO ── */
    function Hero({ lang }) {
      const [cur, setCur] = useState(0);
      const [animKey, setAnimKey] = useState(0);
      const [progress, setProgress] = useState(0);
      const t = TR[lang];
      const slides = t.slides;

      const go = useCallback((next) => {
        const idx = ((next % slides.length) + slides.length) % slides.length;
        setCur(idx);
        setAnimKey(k => k + 1);
        setProgress(0);
      }, [slides.length]);

      useEffect(() => {
        const timer = setInterval(() => go(cur + 1), SLIDE_DURATION);
        return () => clearInterval(timer);
      }, [cur, go]);

      useEffect(() => {
        setProgress(0);
        const start = performance.now();
        let raf;
        const tick = (now) => {
          const p = Math.min(((now - start) / SLIDE_DURATION) * 100, 100);
          setProgress(p);
          if (p < 100) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [cur]);

      const slide = slides[cur];

      return (
        <section id="hero" style={{ position: 'relative', height: '100vh', minHeight: 640, overflow: 'hidden' }}>

          {/* Ken Burns Background */}
          <div key={`bg-${cur}`} style={{
            position: 'absolute', inset: 0,

          {/* Content */}
          <div style={{ position: 'relative', zIndex: 10, height: '100%', display: 'flex', alignItems: 'center', maxWidth: 1400, margin: '0 auto', padding: '80px 1.5rem 0', gap: '4rem' }}>

            {/* Text */}
            <div key={animKey} style={{ flex: 1, maxWidth: 660 }}>
              <div className="reveal-up d0" style={{ marginBottom: '0.8rem' }}>
                <span className="tag-pill">{slide.cat}</span>
              </div>
              <div className="reveal-up d1" style={{ marginBottom: '0.6rem', fontFamily: 'Montserrat', fontSize: '0.7rem', fontWeight: 600, color: 'rgba(255,255,255,0.5)', letterSpacing: '0.18em', textTransform: 'uppercase' }}>

              <h1 className="anton reveal-up d2" style={{

              <p className="reveal-up d3" style={{

                <a href="#tickets" className="btn-yellow">{slide.cta1.toUpperCase()}</a>
                <a href="#productions" className="btn-ghost">{slide.cta2.toUpperCase()}</a>
              </div>
            </div>

            {/* Poster */}
            <div className="hero-poster-col" style={{ flexShrink: 0, width: 255 }}>

              {slides.map((_, i) => (
                <div key={i} onClick={() => go(i)} style={{

                }} />
              ))}
            </div>
            <span style={{ fontFamily: 'Anton', fontSize: '2.2rem', color: 'rgba(242,183,5,0.85)', lineHeight: 1 }}>
              {String(cur + 1).padStart(2, '0')}

          {[{ d: -1, Icon: ChevronLeft, side: 'left' }, { d: 1, Icon: ChevronRight, side: 'right' }].map(({ d, Icon, side }) => (

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const monthKey = `${year}-${String(month + 1).padStart(2, '0')}`;
      const showsByDay = {};
      SHOWS.filter(s => s.date.startsWith(monthKey)).forEach(s => {
        const d = parseInt(s.date.split('-')[2]);
        if (!showsByDay[d]) showsByDay[d] = [];
        showsByDay[d].push(s);
      });

      const prevMonth = () => { setSelectedDay(null); setView(v => v.month === 0 ? { year: v.year - 1, month: 11 } : { ...v, month: v.month - 1 }); };
      const nextMonth = () => { setSelectedDay(null); setView(v => v.month === 11 ? { year: v.year + 1, month: 0 } : { ...v, month: v.month + 1 }); };

      const cells = [];
      for (let i = 0; i < firstDay; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);

      return (
        <section id="calendar" style={{ padding: '7rem 1.5rem', background: '#0D0D0D' }}>
          <div style={{ maxWidth: 920, margin: '0 auto' }}>
            <div style={{ textAlign: 'center', marginBottom: '3rem' }}>
              <p className="label">{t.label}</p>
              <h2 className="section-title" style={{ fontSize: 'clamp(2rem, 4.5vw, 3.5rem)', marginTop: '0.5rem', whiteSpace: 'pre-line' }}>{t.title}</h2>
            </div>

            {/* Month nav */}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1.5rem' }}>
              <button onClick={prevMonth} style={{ background: '#191919', border: 'none', color: 'rgba(255,255,255,0.7)', padding: '0.55rem 1.1rem', cursor: 'pointer', fontFamily: 'Montserrat', fontWeight: 700, fontSize: '0.72rem', letterSpacing: '0.08em', transition: 'color 0.2s' }}
                onMouseEnter={e => e.currentTarget.style.color = '#F2B705'} onMouseLeave={e => e.currentTarget.style.color = 'rgba(255,255,255,0.7)'}>{t.prev}</button>
              <h3 style={{ fontFamily: 'Anton', fontSize: '1.6rem', color: '#F2B705', textTransform: 'uppercase', letterSpacing: '0.05em' }}>{t.months[month]} {year}</h3>
              <button onClick={nextMonth} style={{ background: '#191919', border: 'none', color: 'rgba(255,255,255,0.7)', padding: '0.55rem 1.1rem', cursor: 'pointer', fontFamily: 'Montserrat', fontWeight: 700, fontSize: '0.72rem', letterSpacing: '0.08em', transition: 'color 0.2s' }}
                onMouseEnter={e => e.currentTarget.style.color = '#F2B705'} onMouseLeave={e => e.currentTarget.style.color = 'rgba(255,255,255,0.7)'}>{t.next}</button>
            </div>

            {/* Day headers */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 2, marginBottom: 2 }}>
              {t.days.map(d => (
                <div key={d} style={{ textAlign: 'center', fontFamily: 'Montserrat', fontWeight: 700, fontSize: '0.6rem', letterSpacing: '0.15em', color: 'rgba(255,255,255,0.3)', padding: '0.5rem 0', textTransform: 'uppercase' }}>{d}</div>
              ))}
            </div>

            {/* Grid */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 2, marginBottom: '1.5rem' }}>
              {cells.map((day, i) => {
                const has = day && showsByDay[day];
                const sel = day === selectedDay;
                return (
                  <div key={i} onClick={() => day && setSelectedDay(sel ? null : day)}
                    style={{ background: sel ? '#8C1D40' : day ? '#191919' : 'transparent', minHeight: 80, padding: '0.6rem 0.5rem', cursor: day ? 'pointer' : 'default', transition: 'background 0.18s', position: 'relative' }}
                    onMouseEnter={e => { if (day && !sel) e.currentTarget.style.background = '#222'; }}
                    onMouseLeave={e => { if (day && !sel) e.currentTarget.style.background = '#191919'; }}>
                    {day && (
                      <>
                        <span style={{ fontFamily: 'Montserrat', fontWeight: 700, fontSize: '0.85rem', color: sel ? '#fff' : 'rgba(255,255,255,0.65)' }}>{day}</span>
                        {has && (
                          <div style={{ marginTop: '0.4rem', display: 'flex', flexDirection: 'column', gap: 3 }}>
                            {showsByDay[day].slice(0, 3).map((s, j) => (
                              <div key={j} style={{ height: 4, background: TYPE_COLORS[s.type] || '#F2B705', borderRadius: 2 }} />
                            ))}
                          </div>
                        )}
                      </>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Selected day detail */}
            {selectedDay && (
              <div style={{ background: '#191919', padding: '2rem', borderTop: '3px solid #F2B705', marginBottom: '2rem' }}>
                {(showsByDay[selectedDay] || []).length === 0 ? (
                  <p style={{ fontFamily: 'Montserrat', color: 'rgba(255,255,255,0.4)', textAlign: 'center', fontSize: '0.9rem' }}>{t.noShows}</p>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '1.2rem' }}>
                    {showsByDay[selectedDay].map((s, i) => (
                      <div key={i} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '1rem', flexWrap: 'wrap', paddingBottom: i < showsByDay[selectedDay].length - 1 ? '1.2rem' : 0, borderBottom: i < showsByDay[selectedDay].length - 1 ? '1px solid rgba(255,255,255,0.06)' : 'none' }}>
                        <div>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', marginBottom: '0.3rem' }}>
                            <div style={{ width: 10, height: 10, borderRadius: '50%', background: TYPE_COLORS[s.type] || '#F2B705', flexShrink: 0 }} />
                            <h4 style={{ fontFamily: 'Anton', fontSize: '1.1rem', color: '#fff', textTransform: 'uppercase' }}>{s.title}</h4>
                            <span className="tag-pill" style={{ fontSize: '0.6rem' }}>{s.type}</span>
                          </div>
                          <p style={{ fontFamily: 'Montserrat', fontSize: '0.8rem', color: 'rgba(255,255,255,0.5)', paddingLeft: '1.4rem' }}>🕐 {s.time} &nbsp;·&nbsp; 📍 {s.location}</p>
                        </div>
                        <a href="#tickets" className={s.free ? 'btn-outline' : 'btn-yellow'} style={{ fontSize: '0.68rem', padding: '0.6rem 1.2rem', flexShrink: 0 }}>
                          {s.free ? t.freeEntry : t.buyTickets}
                        </a>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* Legend */}
            <div style={{ display: 'flex', gap: '1.2rem', flexWrap: 'wrap', justifyContent: 'center' }}>
              {Object.entries(TYPE_COLORS).map(([type, color]) => (
                <div key={type} style={{ display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
                  <div style={{ width: 10, height: 10, borderRadius: '50%', background: color }} />
                  <span style={{ fontFamily: 'Montserrat', fontSize: '0.65rem', color: 'rgba(255,255,255,0.45)', letterSpacing: '0.08em' }}>{type}</span>

            </div>
          </div>
        </section>

    }

      const t = TR[lang].gallery;

      const IMGS = [
        { src: 'https://images.unsplash.com/photo-1516307365426-bea591f05011?w=1400&q=90', thumb: 'https://images.unsplash.com/photo-1516307365426-bea591f05011?w=600&q=75' },
        { src: 'https://images.unsplash.com/photo-1503095396549-807759245b35?w=1400&q=90', thumb: 'https://images.unsplash.com/photo-1503095396549-807759245b35?w=600&q=75' },
        { src: 'https://images.unsplash.com/photo-1528360983277-13d401cdc186?w=1400&q=90', thumb: 'https://images.unsplash.com/photo-1528360983277-13d401cdc186?w=600&q=75' },
        { src: 'https://images.unsplash.com/photo-1460723237483-7a6dc9d0b212?w=1400&q=90', thumb: 'https://images.unsplash.com/photo-1460723237483-7a6dc9d0b212?w=600&q=75' },
        { src: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1400&q=90', thumb: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=600&q=75' },
        { src: 'https://images.unsplash.com/photo-1514306688989-657abdcd0e8f?w=1400&q=90', thumb: 'https://images.unsplash.com/photo-1514306688989-657abdcd0e8f?w=600&q=75' },
      ];
      const total = IMGS.length;
      const prev = () => setLbIdx(i => (i - 1 + total) % total);
      const next = () => setLbIdx(i => (i + 1) % total);

      useEffect(() => {
        if (lbIdx === null) return;
        const onKey = (e) => {
          if (e.key === 'Escape') setLbIdx(null);
          if (e.key === 'ArrowLeft')  setLbIdx(i => (i - 1 + total) % total);
          if (e.key === 'ArrowRight') setLbIdx(i => (i + 1) % total);
        };
        window.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
      }, [lbIdx]);

      return (
        <>
          <section id="gallery" style={{ padding: '7rem 1.5rem', background: '#111111' }}>
            <div style={{ maxWidth: 1400, margin: '0 auto' }}>
              <div style={{ textAlign: 'center', marginBottom: '4rem' }}>

                    <img src={img.thumb} alt={`Gallery ${i+1}`} loading="lazy"

                    <div className="gl-over" style={{ position: 'absolute', inset: 0, background: 'rgba(140,29,64,0.65)', display: 'flex', alignItems: 'center', justifyContent: 'center', opacity: 0, transition: 'opacity 0.3s' }}>
                      <span style={{ fontFamily: 'Anton', fontSize: '0.8rem', letterSpacing: '0.2em', color: '#fff', border: '2px solid rgba(255,255,255,0.7)', padding: '0.55rem 1.2rem', textTransform: 'uppercase' }}>{t.expand}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* ── LIGHTBOX ── */}
          {lbIdx !== null && (
            <div onClick={() => setLbIdx(null)}
              style={{ position: 'fixed', inset: 0, zIndex: 9999, background: 'rgba(0,0,0,0.96)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

              {/* Close */}
              <button onClick={() => setLbIdx(null)}
                style={{ position: 'absolute', top: '1.25rem', right: '1.25rem', background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.18)', color: '#fff', width: 48, height: 48, borderRadius: '50%', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 10, transition: 'background 0.2s' }}
                onMouseEnter={e => e.currentTarget.style.background = '#8C1D40'}
                onMouseLeave={e => e.currentTarget.style.background = 'rgba(255,255,255,0.08)'}>
                <X size={20} />
              </button>

              {/* Counter */}
              <div style={{ position: 'absolute', top: '1.5rem', left: '50%', transform: 'translateX(-50%)', fontFamily: 'Anton', color: 'rgba(255,255,255,0.45)', fontSize: '0.85rem', letterSpacing: '0.2em', userSelect: 'none' }}>
                {lbIdx + 1} / {total}
              </div>

              {/* Prev */}
              <button onClick={e => { e.stopPropagation(); prev(); }}
                style={{ position: 'absolute', left: '1rem', background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', color: '#fff', width: 56, height: 56, borderRadius: '50%', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 10, transition: 'background 0.2s' }}
                onMouseEnter={e => e.currentTarget.style.background = '#8C1D40'}
                onMouseLeave={e => e.currentTarget.style.background = 'rgba(255,255,255,0.08)'}>
                <ChevronLeft size={26} />
              </button>

              {/* Image */}
              <img key={lbIdx} src={IMGS[lbIdx].src} alt={`Gallery ${lbIdx+1}`}
                onClick={e => e.stopPropagation()}
                style={{ maxHeight: '88vh', maxWidth: '88vw', objectFit: 'contain', boxShadow: '0 30px 80px rgba(0,0,0,0.8)', userSelect: 'none' }} />

              {/* Next */}
              <button onClick={e => { e.stopPropagation(); next(); }}
                style={{ position: 'absolute', right: '1rem', background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', color: '#fff', width: 56, height: 56, borderRadius: '50%', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 10, transition: 'background 0.2s' }}

                <ChevronRight size={26} />
              </button>

              <div style={{ position: 'absolute', bottom: '1.5rem', left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: '8px' }}>
                {IMGS.map((img, i) => (
                  <div key={i} onClick={e => { e.stopPropagation(); setLbIdx(i); }}

                    <img src={img.thumb} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      );
    }

                          </div>
                        </div>
                        <div style={{ padding: '1.6rem', flex: 1, display: 'flex', flexDirection: 'column' }}>
                          <span className="tag-pill" style={{ marginBottom: '0.8rem', alignSelf: 'flex-start' }}>{article.cat}</span>
                          <h3 style={{ fontFamily: 'Anton', fontSize: '1.1rem', color: '#fff', textTransform: 'uppercase', lineHeight: 1.3, marginBottom: '0.7rem' }}>{article.title}</h3>
                          <p style={{ fontFamily: 'Montserrat', fontSize: '0.83rem', color: 'rgba(255,255,255,0.6)', lineHeight: 1.65, marginBottom: '1.2rem', flex: 1 }}>{article.excerpt}</p>
                          <div style={{ display: 'flex', gap: '1rem', alignItems: 'center', fontSize: '0.68rem', color: 'rgba(255,255,255,0.35)', fontFamily: 'Montserrat', borderTop: '1px solid rgba(255,255,255,0.08)', paddingTop: '1rem', flexWrap: 'wrap' }}>
                            <span style={{ display: 'flex', alignItems: 'center', gap: '0.3rem' }}><Calendar size={11} />{article.date}</span>
                            <span style={{ display: 'flex', alignItems: 'center', gap: '0.3rem' }}><User size={11} />{article.author}</span>
                            <span>~{Math.ceil(article.content.split(' ').length / 200)} {t.readTime}</span>
                          </div>
                        </div>
                      </article>
                    ))}
                  </div>
                )}
              </>
            )}
          </div>
        </section>
      );
    }

    /* ── AUDITIONS BANNER ── */
    function AuditionsBanner({ lang }) {
      const t = TR[lang].auditions;
      return (
        <section id="auditions" style={{ background: '#8C1D40', padding: '5rem 1.5rem', position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', inset: 0, backgroundImage: 'url(https://images.unsplash.com/photo-1503095396549-807759245b35?w=1200&q=60)', backgroundSize: 'cover', backgroundPosition: 'center', opacity: 0.1 }} />
          <div style={{ position: 'relative', zIndex: 1, maxWidth: 1400, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '2rem' }}>
            <div>
              <p className="label" style={{ color: 'rgba(255,255,255,0.6)' }}>{t.label}</p>
              <h2 style={{ fontFamily: 'Anton', fontSize: 'clamp(2rem, 4vw, 3.2rem)', color: '#F2B705', textTransform: 'uppercase', lineHeight: 1, marginTop: '0.4rem', whiteSpace: 'pre-line' }}>{t.title}</h2>
              <p style={{ fontFamily: 'Montserrat', fontWeight: 300, color: 'rgba(255,255,255,0.8)', marginTop: '1rem', fontSize: '1rem', maxWidth: 480, lineHeight: 1.7 }}>{t.sub}</p>
            </div>
            <a href="#contact" style={{ background: '#F2B705', color: '#0D0D0D', fontFamily: 'Anton', fontSize: '0.85rem', letterSpacing: '0.08em', textTransform: 'uppercase', padding: '1.1rem 2.5rem', textDecoration: 'none', display: 'inline-block', transition: 'background 0.2s, transform 0.2s' }}
              onMouseEnter={e => { e.currentTarget.style.background = '#F2C94C'; e.currentTarget.style.transform = 'scale(1.03)'; }}
              onMouseLeave={e => { e.currentTarget.style.background = '#F2B705'; e.currentTarget.style.transform = 'scale(1)'; }}>
              {t.cta}
            </a>
          </div>
        </section>
      );
    }

    /* ── COMMUNITY ── */
    function Community({ lang }) {
      const t = TR[lang].community;
      return (
        <section id="community" style={{ padding: '7rem 1.5rem', background: '#0D0D0D' }}>
          <div style={{ maxWidth: 1400, margin: '0 auto' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: '3rem', flexWrap: 'wrap', gap: '1rem' }}>
              <div>
                <p className="label">{t.label}</p>
                <h2 className="section-title" style={{ fontSize: 'clamp(2rem, 4.5vw, 3.5rem)', marginTop: '0.5rem', whiteSpace: 'pre-line' }}>{t.title}</h2>
              </div>
              <a href="https://instagram.com/rutateatralmiami" target="_blank" rel="noreferrer"
                style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', fontFamily: 'Montserrat', fontWeight: 700, fontSize: '0.72rem', letterSpacing: '0.12em', color: '#F2B705', textDecoration: 'none', textTransform: 'uppercase' }}>
                <Instagram size={15} /> @rutateatralmiami
              </a>
            </div>
            <div className="insta-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: '0.75rem', marginBottom: '4rem' }}>
              {INSTA_IMGS.map((src, i) => (
                <div key={i} className="img-overlay" style={{ aspectRatio: '1', cursor: 'pointer' }}>
                  <img src={src} alt={`Community ${i + 1}`} loading="lazy" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                  <div className="overlay"><Instagram size={28} color="#fff" /></div>
                </div>
              ))}
            </div>
            <div className="grid-3" style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '1.5rem' }}>
              {t.news.map((n, i) => (
                <div key={i} className="card" style={{ background: '#191919', overflow: 'hidden' }}>
                  <div className="img-overlay" style={{ height: 200 }}>
                    <img src={NEWS_IMGS[i]} alt={n.title} loading="lazy" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                  </div>
                  <div style={{ padding: '1.4rem' }}>
                    <p style={{ fontFamily: 'Montserrat', fontWeight: 700, fontSize: '0.62rem', letterSpacing: '0.2em', textTransform: 'uppercase', color: '#8C1D40', marginBottom: '0.6rem' }}>{n.cat}</p>
                    <h4 style={{ fontFamily: 'Anton', fontSize: '1.1rem', color: '#fff', textTransform: 'uppercase', lineHeight: 1.25, marginBottom: '0.75rem' }}>{n.title}</h4>
                    <p style={{ fontFamily: 'Montserrat', fontSize: '0.72rem', color: 'rgba(255,255,255,0.35)', letterSpacing: '0.05em' }}>{n.date}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ── NEWSLETTER ── */
    function Newsletter({ lang }) {
      const [email, setEmail] = useState('');
      const [sent, setSent] = useState(false);
      const t = TR[lang].newsletter;
      return (
        <section style={{ padding: '6rem 1.5rem', background: '#111111', borderTop: '1px solid rgba(255,255,255,0.04)' }}>
          <div style={{ maxWidth: 660, margin: '0 auto', textAlign: 'center' }}>
            <p className="label">{t.label}</p>
            <h2 style={{ fontFamily: 'Anton', fontSize: 'clamp(2rem, 4.5vw, 3.5rem)', color: '#F2B705', textTransform: 'uppercase', lineHeight: 1, margin: '0.6rem 0 1rem', whiteSpace: 'pre-line' }}>{t.title}</h2>
            <p style={{ fontFamily: 'Montserrat', fontWeight: 300, color: 'rgba(255,255,255,0.65)', lineHeight: 1.75, marginBottom: '2.5rem', fontSize: '1rem' }}>{t.sub}</p>
            {sent ? (
              <div style={{ fontFamily: 'Montserrat', fontWeight: 700, fontSize: '1.1rem', color: '#F2B705' }}>{t.thanks}</div>
            ) : (
              <form className="form-row" onSubmit={e => { e.preventDefault(); setSent(true); }} style={{ display: 'flex', gap: '0.5rem', maxWidth: 520, margin: '0 auto' }}>
                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder={t.placeholder} className="form-input" />
                <button type="submit" className="btn-yellow" style={{ whiteSpace: 'nowrap', flexShrink: 0 }}>{t.cta}</button>
              </form>
            )}
          </div>
        </section>
      );
    }

    /* ── FOOTER ── */
    function Footer({ lang }) {
      const t = TR[lang];
      const ft = t.footer;
      const ct = t.contact;
      return (
        <footer id="contact" style={{ background: '#080808', borderTop: '1px solid rgba(255,255,255,0.04)' }}>
          <div style={{ background: '#0D0D0D', borderBottom: '1px solid rgba(255,255,255,0.04)', padding: '3.5rem 1.5rem' }}>
            <div className="footer-grid" style={{ maxWidth: 1400, margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '3rem' }}>
              <div>
                <p style={{ fontFamily: 'Montserrat', fontWeight: 700, fontSize: '0.65rem', letterSpacing: '0.2em', textTransform: 'uppercase', color: '#8C1D40', marginBottom: '1rem' }}>{ct.location}</p>
                <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'flex-start' }}>
                  <MapPin size={15} color="#F2B705" style={{ marginTop: 2, flexShrink: 0 }} />
                  <span style={{ fontFamily: 'Montserrat', fontSize: '0.9rem', color: 'rgba(255,255,255,0.65)', lineHeight: 1.7 }}>401 SW 8th St, Miami, FL 33130<br />South Florida, USA</span>
                </div>
              </div>
              <div>
                <p style={{ fontFamily: 'Montserrat', fontWeight: 700, fontSize: '0.65rem', letterSpacing: '0.2em', textTransform: 'uppercase', color: '#8C1D40', marginBottom: '1rem' }}>{ct.contact}</p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                  <a href="tel:7865292181" style={{ display: 'flex', gap: '0.7rem', alignItems: 'center', fontFamily: 'Montserrat', fontSize: '0.9rem', color: 'rgba(255,255,255,0.65)', textDecoration: 'none' }}>
                    <Phone size={14} color="#F2B705" /> (786) 529-2181
                  </a>
                  <a href="https://rutateatral.org" target="_blank" rel="noreferrer" style={{ display: 'flex', gap: '0.7rem', alignItems: 'center', fontFamily: 'Montserrat', fontSize: '0.9rem', color: 'rgba(255,255,255,0.65)', textDecoration: 'none' }}>
                    <Globe size={14} color="#F2B705" /> rutateatral.org
                  </a>
                </div>
              </div>
              <div>
                <p style={{ fontFamily: 'Montserrat', fontWeight: 700, fontSize: '0.65rem', letterSpacing: '0.2em', textTransform: 'uppercase', color: '#8C1D40', marginBottom: '1rem' }}>{ct.follow}</p>
                <div style={{ display: 'flex', gap: '0.75rem' }}>
                  {[
                    { icon: <Instagram size={18} />, href: 'https://instagram.com/rutateatralmiami' },
                    { icon: <Facebook size={18} />, href: 'https://facebook.com/rutateatralmiami' },
                    { icon: <Youtube size={18} />, href: 'https://youtube.com/@rutateatralmiami' },
                  ].map((s, i) => (
                    <a key={i} href={s.href} target="_blank" rel="noreferrer" className="social-icon">{s.icon}</a>
                  ))}
                </div>
              </div>
            </div>
          </div>

          <div style={{ padding: '3.5rem 1.5rem', borderBottom: '1px solid rgba(255,255,255,0.04)' }}>
            <div className="footer-nav-grid" style={{ maxWidth: 1400, margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: '2.5rem' }}>
              {ft.cols.map(col => (
                <div key={col.title}>
                  <p style={{ fontFamily: 'Montserrat', fontWeight: 700, fontSize: '0.65rem', letterSpacing: '0.18em', textTransform: 'uppercase', color: '#F2B705', marginBottom: '1.2rem' }}>{col.title}</p>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '0.7rem' }}>
                    {col.links.map(l => <a key={l} href="#" className="footer-link">{l}</a>)}
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div style={{ padding: '1.5rem', maxWidth: 1400, margin: '0 auto' }}>
            <div className="footer-bottom" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem' }}>
              <img src={LOGO} alt="Ruta Teatral" style={{ height: 42, width: 'auto', objectFit: 'contain' }} />
              <div style={{ display: 'flex', gap: '1.5rem', flexWrap: 'wrap', justifyContent: 'center' }}>
                <a href="#" className="footer-link">{ft.privacy}</a>
                <a href="#" className="footer-link">{ft.terms}</a>
                <a href="#" className="footer-link">{ft.access}</a>
              </div>
              <p style={{ fontFamily: 'Montserrat', fontSize: '0.72rem', color: 'rgba(255,255,255,0.25)' }}>{ft.copy}</p>
            </div>
          </div>
        </footer>
      );
    }

    /* ── STICKY CTA ── */
    function StickyCTA({ lang }) {
      const [vis, setVis] = useState(false);
      const t = TR[lang];
      useEffect(() => {
        const fn = () => setVis(window.scrollY > 400);
        window.addEventListener('scroll', fn);
        return () => window.removeEventListener('scroll', fn);
      }, []);
      if (!vis) return null;
      return (
        <a id="tickets" href="#productions" className="btn-yellow sticky-ticket"
          style={{ position: 'fixed', bottom: '2rem', right: '2rem', zIndex: 800, boxShadow: '0 8px 32px rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', gap: '0.5rem', fontSize: '0.75rem', padding: '0.9rem 1.5rem' }}>
          {t.cta}
        </a>
      );
    }

    /* ── COOKIE BANNER ── */
    function CookieBanner({ lang }) {
      const [ok, setOk] = useState(false);
      const t = TR[lang].cookie;
      if (ok) return null;
      return (
        <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, zIndex: 850, background: '#191919', borderTop: '2px solid #8C1D40', padding: '1rem 1.5rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '1rem', flexWrap: 'wrap' }}>
          <p style={{ fontFamily: 'Montserrat', fontSize: '0.8rem', color: 'rgba(255,255,255,0.65)', margin: 0, lineHeight: 1.5 }}>
            {t.text} <a href="#" style={{ color: '#F2B705', textDecoration: 'none' }}>{t.link}</a>
          </p>
          <button onClick={() => setOk(true)} className="btn-yellow" style={{ border: 'none', fontSize: '0.72rem', padding: '0.6rem 1.4rem', flexShrink: 0 }}>{t.cta}</button>
        </div>
      );
    }

    /* ── APP ── */
    function App() {
      const [lang, setLang] = useState('es');
      return (
        <>
          <Header lang={lang} setLang={setLang} />
          <main>
            <Hero lang={lang} />
            <StatsBar lang={lang} />
            <About lang={lang} />
            <Productions lang={lang} />
            <Programs lang={lang} />
            <SearchBar lang={lang} />
            <EventsCalendar lang={lang} />
            <Staff lang={lang} />
            <Gallery lang={lang} />
            <Press lang={lang} />
            <Testimonials lang={lang} />
            <Sponsors lang={lang} />
            <FAQs lang={lang} />
            <ContactForm lang={lang} />
            <MapSection lang={lang} />
            <Blog lang={lang} />
            <AuditionsBanner lang={lang} />
            <Community lang={lang} />
            <Newsletter lang={lang} />
          </main>
          <Footer lang={lang} />
          <StickyCTA lang={lang} />
          <CookieBanner lang={lang} />
        </>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
