name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        # `next build` collects page data by evaluating every route module, which
        # imports src/lib/env.ts and validates the env with zod. CI has no real
        # secrets and does not need them — the build never connects to anything —
        # so pass schema-valid placeholders. Real values live in the Vercel project.
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          DATABASE_URL: postgres://user:pass@localhost:5432/placeholder
          SESSION_JWT_SECRET: ci-build-only-placeholder-session-secret
          RESEND_API_KEY: re_placeholder
          RESEND_FROM_EMAIL: ci@example.com
